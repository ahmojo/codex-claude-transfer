name: CI

on:
  push:
    branches: [main, Main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build / vet / test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Verify formatting
        if: runner.os != 'Windows'
        shell: bash
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Linux is the required encryption gate. macOS and Windows remain
      # best-effort coverage because their package-manager mirrors are less
      # predictable on hosted runners.
      - name: Install age (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          command -v age
          command -v age-keygen

      - name: Install age (macOS)
        if: runner.os == 'macOS'
        continue-on-error: true
        run: brew install age

      - name: Install age (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: choco install age.portable -y

      - name: Verify encryption round trip (Linux)
        if: runner.os == 'Linux'
        run: go test ./internal/crypt -run '^TestRoundTripWithRecipientsFile$' -count=1 -v

      - name: Test
        run: go test ./...

  govulncheck:
    name: govulncheck (known vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      # The official action pins a govulncheck build compatible with the Go
      # toolchain it installs (avoiding the x/tools generics panic that bleeding-
      # edge toolchains hit with `go install govulncheck@latest`).
      - name: Scan for known vulnerabilities
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
